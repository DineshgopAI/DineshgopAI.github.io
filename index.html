# Reasoning Myself Into 'Okay'

*what am I attached to?*  
*what do I want from her?*

Never have I ever questioned that. Because questioning kills the joy.

I felt sympathy. Joy. And then I observed the flaws. She was shorter than me. Eyes that weren't black, something different, something I couldn't name. Light sometimes. Sharp sometimes. The way she spoke about others, taking them for granted without noticing. The way she carried herself like no one understood her, like that made her special. She had enough attention. She didn't have that problem. So many flaws. Enough to make me puke, initially.

But over time, surprisingly to me, the flaws didn't stop me from falling for her. I was drawn to her imperfections. Maybe because I only wanted to see those imperfections. The rest didn't matter much.

Somewhere quiet. Late.

She always told me about her problems. I was just a listening machine. Heavy secrets. Shameful ones too. I looked away when I told mine like it didn't bother me. But it did bother me. With enough time and attention she gave, I thought this would work. Time and stable attention, that's really my kryptonite.

It was late where we usually met. She felt it. The moment I decided to tell her, her senses sharp. Like prey sensing the hunter before the shot. I stumbled multiple times. She insisted I tell her before leaving. Funny, it was about the time to leave. I still didn't say a word. She said she was leaving.

I grabbed her hand. It was cold. My hands started shaking.

> *“Please. 5 more minutes. I'm gonna tell.”*

My voice cracked. Repeating the same lines over and over. Out of words. My friends gave me the courage. And I just burst. Heart started pounding. Stomach felt like I was about to give a hard exam where even knowing the answers, anxiety kills it.

She rejected me gently. Her face hid the emotion. Smiled gently. Tired reasoning with me. The moment she started reasoning, my brain went blank *what did I even do?*

And I gave a shaky hand. Never able to look straight, close into her eyes. But I never let the *what ifs* win this time. I still stood.

Still craving that attention made me weak over time. Remove the attention, and what's left is depression. An enormous amount of it.

How to escape this? Work, I guess.

***

And that's when my brain started searching for reasons.

Take a case: seeing a random girl, in real time the brain automatically evaluates that as "Ahh, she is hot." The brain naturally tends to do things that it finds joy in. There is a reward system it follows, and if you exploit that system, you have control over it. This system controls the emotions.

*Does starvation create value? What does a body actually need? Water. Food. Why? Energy. To go get more water and food. But if those were supplied effortlessly, what comes next? Sex is the ultimate. Yet with unlimited access, would the body even crave it? I guess not. Once you get what you wanted, the value factor drops or shifts to something else.*

Same with attention.

When someone craves attention early and gets only minimal attention, the brain marks it as sacred. Scarcity becomes significance. Builds an illusion from it. Desperation blinds.

The brain is a reasoning machine. It reasons something inferior into "okay," given enough time and scarcity of what it originally wanted.

Now why does the brain tend to settle for things below the standard the system created? Given enough time, watching or having anything even if it's not good makes the brain settle for whatever is available. Just like the body: if you provide enough food, it's fine. But shortage forces it into survival mode, where it has to use whatever resources are left. If you're born in a town and suddenly forced to live in a jungle, you try to survive on whatever is there, even insects and worms. 

The same rule applies to emotional starvation. After a long time of not finding someone truly beautiful or sharp, the brain settles for whatever is in front of it the equivalent of insects. That's what happened in my case. It might have been an insect initially, but when nothing else was there, I tried to survive on it.

The brain is an adaptation machine.

I think through it and the dots connect. Someone the brain rates a 6/10 on looks alone, but with factors like the anger, the mood swings, the attitude, she's really a 4. Starved enough, those attributes go quiet, and you adapt anyway, trying to make it work.

Inferior species are the result of scarce resources. Ha that actually makes sense.

I was just trying to make sense of why I still wanted her.

But you hurt yourself in the adapting.

Especially when even the opposite species rejects you.

The brain knows, somewhere, that all that time and energy had no real value.

And that's what actually hurts.
        `;
